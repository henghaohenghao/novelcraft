# NovelCraft 生产编排
# 用法：
#   1. cp .env.example .env 并填入生产配置
#   2. docker compose up -d --build
#
# 说明：
#   - 仅 backend / frontend 对宿主暴露端口，其余服务仅容器内网互通
#   - 生产建议在前再加 Nginx 反代 80/443，详见 云服务器部署指南.md
#   - Neo4j / Qdrant 启动失败时后端会自动降级，不会阻塞整体启动
#   - 国内服务器需配置 Docker 镜像加速器，见下方注释
#
# 镜像加速器配置（国内服务器必须）：
#   sudo tee /etc/docker/daemon.json <<-'EOF'
#   { "registry-mirrors": ["https://docker.1ms.run","https://docker.xuanyuan.me"] }
#   EOF
#   sudo systemctl daemon-reload && sudo systemctl restart docker

services:
  # ====== 基础设施 ======
  postgres:
    image: postgres:16-alpine
    container_name: novelcraft-postgres
    environment:
      POSTGRES_USER: novelcraft
      POSTGRES_PASSWORD: novelcraft123
      POSTGRES_DB: novelcraft
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelcraft"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 如需本机调试，取消下行注释（默认不对外暴露）
    # ports: ["127.0.0.1:5432:5432"]

  redis:
    image: redis:7-alpine
    container_name: novelcraft-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: novelcraft-neo4j
    environment:
      NEO4J_AUTH: neo4j/novelcraft123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    # Neo4j Browser 调试端口（默认不对外暴露）
    # ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: novelcraft-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    # qdrant 镜像无 curl/wget，无法做 HTTP 健康检查
    # backend 对 qdrant 失败有降级处理，不阻塞启动
    # ports: ["127.0.0.1:6333:6333"]

  # ====== 应用 ======
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novelcraft-backend
    env_file: .env
    volumes:
      - /root/models:/models
    environment:
      # 容器内通过服务名访问基础设施
      NOVELCRAFT_DB_HOST: postgres
      NOVELCRAFT_NEO4J_URI: bolt://neo4j:7687
      NOVELCRAFT_QDRANT_HOST: qdrant
      NOVELCRAFT_REDIS_URL: redis://redis:6379/0
      NOVELCRAFT_CELERY_BROKER_URL: redis://redis:6379/1
      NOVELCRAFT_CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        BACKEND_ORIGIN: http://backend:8000
    container_name: novelcraft-frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
